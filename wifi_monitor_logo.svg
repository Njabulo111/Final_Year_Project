<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
  <title>WiFi Congestion Monitor — app logo</title>

  <!-- background -->
  <rect width="680" height="420" fill="#f0f6ff"/>

  <!-- outer decorative ring -->
  <circle cx="340" cy="196" r="155" stroke="#1f5fad" stroke-width="0.5" fill="none" stroke-dasharray="4 6"/>
  <circle cx="340" cy="196" r="148" stroke="#ccdff5" stroke-width="0.5" fill="none"/>

  <!-- hexagon body -->
  <polygon points="340,58 462,127 462,265 340,330 218,265 218,127" fill="#f0f6ff" stroke="none"/>
  <polygon points="340,62 458,130 458,262 340,330 222,262 222,130" fill="#ffffff" stroke="none"/>
  <polygon points="340,62 458,130 458,262 340,330 222,262 222,130" stroke="#1f5fad" stroke-width="2" fill="none"/>

  <!-- circuit traces -->
  <line x1="222" y1="196" x2="255" y2="196" stroke="#94b8df" stroke-width="1"/>
  <line x1="425" y1="196" x2="458" y2="196" stroke="#94b8df" stroke-width="1"/>
  <polyline points="255,155 268,155 268,168" stroke="#94b8df" stroke-width="1" fill="none"/>
  <polyline points="412,155 424,155 424,168" stroke="#94b8df" stroke-width="1" fill="none"/>
  <polyline points="255,237 268,237 268,224" stroke="#94b8df" stroke-width="1" fill="none"/>
  <polyline points="412,237 424,237 424,224" stroke="#94b8df" stroke-width="1" fill="none"/>
  <circle cx="255" cy="196" r="3" fill="#1f5fad"/>
  <circle cx="425" cy="196" r="3" fill="#1f5fad"/>
  <circle cx="268" cy="168" r="3" fill="#1f5fad"/>
  <circle cx="412" cy="168" r="3" fill="#1f5fad"/>
  <circle cx="268" cy="224" r="3" fill="#1f5fad"/>
  <circle cx="412" cy="224" r="3" fill="#1f5fad"/>

  <!-- WiFi arcs — red / amber / green -->
  <path d="M280,175 A85,85 0 0,1 400,175" stroke="#c0392b" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <path d="M296,183 A62,62 0 0,1 384,183" stroke="#c97a00" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <path d="M311,191 A40,40 0 0,1 369,191" stroke="#1a8c3e" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <circle cx="340" cy="196" r="7" fill="#1a8c3e"/>

  <!-- sine wave -->
  <path d="M270,230 Q283,218 296,230 Q309,242 322,230 Q335,218 348,230 Q361,242 374,230 Q387,218 400,230 Q413,242 410,230"
        stroke="#1f5fad" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- score bar -->
  <rect x="270" y="252" width="140" height="7" rx="3" fill="#e0e8f0"/>
  <rect x="270" y="252" width="50" height="7" fill="#1a8c3e"/>
  <rect x="320" y="252" width="40" height="7" fill="#c97a00"/>
  <rect x="360" y="252" width="50" height="7" fill="#c0392b"/>
  <rect x="306" y="252" width="2"  height="7" fill="#ffffff" opacity="0.8"/>
  <rect x="348" y="252" width="2"  height="7" fill="#ffffff" opacity="0.8"/>

  <!-- lightning bolt -->
  <polygon points="434,86 426,106 432,106 424,124 445,101 437,101 447,86" fill="#e8f3ff" stroke="none"/>
  <polygon points="434,86 426,106 432,106 424,124 445,101 437,101 447,86" stroke="#1f5fad" stroke-width="1.5" fill="none"/>

  <!-- app name -->
  <text x="340" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#0d2d5e">WiFi Monitor</text>
  <text x="340" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="400" letter-spacing="2.5" fill="#1f5fad">CONGESTION · DETECT · RECOMMEND</text>

  <!-- footer text -->
  <text x="340" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6a9fcf" letter-spacing="1">Electrical &amp; Electronic Engineering</text>
  <text x="340" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6a9fcf" letter-spacing="1">University of Johannesburg</text>

  <!-- tick marks -->
  <line x1="340" y1="42" x2="340" y2="50" stroke="#1f5fad" stroke-width="1"/>
  <line x1="340" y1="342" x2="340" y2="350" stroke="#1f5fad" stroke-width="1"/>
  <line x1="488" y1="119" x2="481" y2="123" stroke="#1f5fad" stroke-width="1"/>
  <line x1="192" y1="119" x2="199" y2="123" stroke="#1f5fad" stroke-width="1"/>
  <line x1="488" y1="273" x2="481" y2="269" stroke="#1f5fad" stroke-width="1"/>
  <line x1="192" y1="273" x2="199" y2="269" stroke="#1f5fad" stroke-width="1"/>
</svg>
