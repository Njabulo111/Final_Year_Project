<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi Congestion Monitor — UJ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; color: #2c2c2c; }
    header { background: #1f5fad; color: white; padding: 16px 24px; }
    header h1 { font-size: 1.3rem; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .rec-box { background: white; border-left: 5px solid #1f5fad; border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .nav-box { display:none; background:white; border-left:5px solid #c97a00; border-radius:8px; padding:16px 20px; margin-bottom:20px; box-shadow:0 1px 4px rgba(0,0,0,0.08); }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    th { background: #1f5fad; color: white; padding: 10px 14px; font-size: 0.8rem; text-align: left; }
    td { padding: 10px 14px; font-size: 0.88rem; border-bottom: 1px solid #eee; }
    tr.connected { background: #eef5ff; font-weight: bold; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
    .green  { background: #d4edda; color: #1a6b3a; }
    .orange { background: #fff3cd; color: #856404; }
    .red    { background: #f8d7da; color: #721c24; }
    .btn-switch { padding:5px 12px; background:#1a6b3a; color:white; border:none; border-radius:4px; cursor:pointer; font-size:0.8rem; }
    .btn-nav { padding:5px 10px; background:#c97a00; color:white; border:none; border-radius:4px; cursor:pointer; font-size:0.8rem; margin-left:4px; }
  </style>
</head>
<body>
  <header>
    <h1>Intelligent WiFi Congestion Monitor</h1>
    <div style="display:flex; gap:16px; align-items:center;">
      <p>University of Johannesburg — Electrical &amp; Electronic Engineering</p>
      <a href="/survey" style="color:rgba(255,255,255,0.8);font-size:0.85rem;text-decoration:none;border:1px solid rgba(255,255,255,0.3);padding:4px 10px;border-radius:4px;">RF Site Survey ↗</a>
    </div>
  </header>

  <div class="container">
    <div id="nav-box" class="nav-box">
      <div style="display:flex; justify-content:space-between; align-items:start;">
        <div>
          <h2 style="font-size:0.8rem;text-transform:uppercase;color:#888;margin-bottom:8px;">Navigation Guidance</h2>
          <p id="nav-message" style="font-size:0.95rem;font-weight:500;">Calculating...</p>
        </div>
        <button onclick="cancelNav()" style="padding:5px 12px;background:#888;color:white;border:none;border-radius:4px;cursor:pointer;font-size:0.8rem;">Cancel</button>
      </div>
    </div>

    <div class="rec-box">
      <h2 style="font-size:0.8rem;text-transform:uppercase;color:#888;margin-bottom:8px;">System Recommendation</h2>
      <p id="recommendation">Loading...</p>
    </div>

    <table>
      <thead>
        <tr>
          <th>AP Name (SSID)</th>
          <th>BSSID</th>
          <th>Signal (dBm)</th>
          <th>Channel</th>
          <th>Latency (ms)</th>
          <th>Score</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="ap-table-body"></tbody>
    </table>
  </div>

  <script>
    window.currentScore = 0;

    async function switchToAP(ssid, bssid) {
        const btn = event.target;
        btn.textContent = 'Switching...';
        btn.disabled = true;
        try {
            const res = await fetch('/api/switch', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ ssid: ssid, bssid: bssid })
            });
            const result = await res.json();
            if (result.success) {
                btn.textContent = 'Connected!';
                btn.style.background = '#1f5fad';
                setTimeout(fetchData, 3000);
            } else {
                btn.textContent = 'Failed';
                alert('Switch failed: ' + result.message);
            }
        } catch(e) { alert('Network error: ' + e); }
    }

    async function navigateToAP(ssid, bssid) {
        await fetch('/api/navigate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ ssid: ssid, bssid: bssid })
        });
        document.getElementById('nav-box').style.display = 'block';
    }

    async function cancelNav() {
        await fetch('/api/navigate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ bssid: '' })
        });
        document.getElementById('nav-box').style.display = 'none';
    }

    async function fetchData() {
      try {
        const res  = await fetch('/api/data');
        const data = await res.json();

        document.getElementById('recommendation').textContent = data.recommendation || 'Waiting for scan results...';

        if (!data.aps.length) {
            document.getElementById('ap-table-body').innerHTML = '<tr><td colspan="8">No APs found. Make sure the device WiFi is enabled.</td></tr>';
            return;
        }

        if (data.nav_message) {
            document.getElementById('nav-message').textContent = data.nav_message;
            document.getElementById('nav-box').style.display = 'block';
        }

        const currentAP = data.aps.find(a => a.is_connected);
        window.currentScore = currentAP ? currentAP.score : 0;
        if (!currentAP) {
            document.getElementById('recommendation').textContent = 'Device is not connected to WiFi. Use the Switch button to connect to a nearby AP.';
        }

        const tbody = document.getElementById('ap-table-body');
        tbody.innerHTML = data.aps.map(ap => `
          <tr class="${ap.is_connected ? 'connected' : ''}">
            <td>${ap.ssid || 'Hidden'}${ap.is_connected ? ' ★' : ''}</td>
            <td style="font-family:monospace;font-size:0.8rem">${ap.bssid}</td>
            <td>${ap.rssi} dBm</td>
            <td>${ap.channel}</td>
            <td>${ap.latency_ms != null ? ap.latency_ms.toFixed(0) : '—'}</td>
            <td><strong>${ap.score.toFixed(0)}</strong></td>
            <td><span class="badge ${ap.colour}">${ap.status}</span></td>
            <td>
                ${!ap.is_connected && ap.score > (window.currentScore + 15)
                  ? `<button class="btn-switch" onclick="switchToAP('${ap.ssid}','${ap.bssid}')">Switch →</button>` : ''}
                ${!ap.is_connected ? `<button class="btn-nav" onclick="navigateToAP('${ap.ssid}','${ap.bssid}')">Navigate</button>` : ''}
            </td>
          </tr>`).join('');
      } catch(e) { console.error('Fetch error:', e); }
    }

    fetchData();
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
